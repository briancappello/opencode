name: sync

on:
  schedule:
    # Run daily at 8:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific upstream tag to sync to (e.g. v0.3.17)"
        required: false
        type: string
      force:
        description: "Force sync even if already up-to-date"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  check:
    name: Check for upstream updates
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.check.outputs.should_sync }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      fork_release: ${{ steps.check.outputs.fork_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure upstream remote
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git || true
          git fetch upstream --tags

      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          # Get latest upstream tag
          if [ -n "$INPUT_TAG" ]; then
            UPSTREAM_TAG="$INPUT_TAG"
          else
            UPSTREAM_TAG=$(git tag -l "v*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          fi
          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $UPSTREAM_TAG"

          # Get latest fork release
          FORK_RELEASE=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          echo "fork_release=$FORK_RELEASE" >> $GITHUB_OUTPUT
          echo "Latest fork release: $FORK_RELEASE"

          # Extract base version from fork release (strip +brian.N suffix)
          FORK_BASE=$(echo "$FORK_RELEASE" | sed 's/+.*//')
          echo "Fork base version: $FORK_BASE"

          # Determine if sync is needed
          if [ "$INPUT_FORCE" = "true" ]; then
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "Forced sync requested"
          elif [ -z "$FORK_RELEASE" ]; then
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "No fork releases exist, sync needed"
          elif [ "$FORK_BASE" != "$UPSTREAM_TAG" ]; then
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "New upstream tag detected, sync needed"
          else
            echo "should_sync=false" >> $GITHUB_OUTPUT
            echo "Already up-to-date"
          fi

  sync:
    name: Sync fork
    needs: check
    if: needs.check.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.sync.outputs.success }}
      upstream_tag: ${{ steps.sync.outputs.upstream_tag }}
      patches_applied: ${{ steps.sync.outputs.patches_applied }}
      failed_prs: ${{ steps.sync.outputs.failed_prs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Configure git
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git remote add upstream https://github.com/anomalyco/opencode.git || true
          git fetch upstream --tags

      - name: Run sync script
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
        run: |
          bun script/sync.ts --tag "$UPSTREAM_TAG"

      - name: Push make-it-mine branch
        if: steps.sync.outputs.success == 'true'
        run: |
          git push origin make-it-mine --force-with-lease

  notify-failure:
    name: Open issue on failure
    needs: sync
    if: failure() || needs.sync.outputs.success == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ needs.sync.outputs.upstream_tag || needs.check.outputs.upstream_tag }}
          FAILED_PRS: ${{ needs.sync.outputs.failed_prs }}
        run: |
          TITLE="Sync failed: upstream $UPSTREAM_TAG"
          BODY="## Sync Failure Report

          **Upstream tag:** \`$UPSTREAM_TAG\`
          **Failed PRs:** $FAILED_PRS
          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Next steps
          1. Review the workflow logs for detailed error messages
          2. Check if the failing PRs have conflicts with the upstream changes
          3. Either resolve conflicts manually or remove the PR from \`patches.json5\`
          4. Re-run the sync workflow manually
          "

          # Check if issue already exists
          EXISTING=$(gh issue list --search "Sync failed: upstream $UPSTREAM_TAG" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already exists, adding comment"
            gh issue comment "$EXISTING" --body "Sync attempted again and failed. See workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "sync-failure"
          fi

  trigger-release:
    name: Trigger release workflow
    needs: sync
    if: needs.sync.outputs.success == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fork-release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run fork-release.yml \
            --repo ${{ github.repository }} \
            --ref make-it-mine \
            -f upstream_tag="${{ needs.sync.outputs.upstream_tag }}"
